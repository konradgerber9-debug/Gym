<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gym Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gym">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0c10">
<style>
:root{--bg:#0b0c10;--card:rgba(255,255,255,.055);--line:rgba(255,255,255,.09);--tx:#f5f6fa;--mute:#8f96a8;--a:#ff7a3d;--b:#ff3d81;--grad:linear-gradient(135deg,#ff7a3d,#ff3d81)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--tx);font:16px/1.4 -apple-system,"SF Pro Display",system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg)}
body{min-height:100vh;background:radial-gradient(600px 400px at 90% -5%,rgba(255,61,129,.18),transparent),radial-gradient(500px 400px at -10% 10%,rgba(255,122,61,.14),transparent),var(--bg);background-attachment:fixed;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 96px)}
h1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:0 0 4px}
.sub{color:var(--mute);font-size:14px;margin-bottom:18px}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--mute);margin:24px 0 10px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
label{display:block;font-size:11px;color:var(--mute);margin:0 0 4px 2px;text-transform:uppercase;letter-spacing:.06em}
input,select{width:100%;background:rgba(0,0,0,.35);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px;font-family:inherit;appearance:none;-webkit-appearance:none}
input:focus,select:focus{outline:0;border-color:var(--a)}
button{font:inherit;border:0;border-radius:14px;padding:13px;background:var(--grad);color:#fff;font-weight:700;width:100%;margin-top:12px;box-shadow:0 8px 24px rgba(255,61,129,.25)}
button:active{transform:scale(.98)}
button.gh{background:var(--card);border:1px solid var(--line);box-shadow:none;color:var(--tx);margin-top:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}.row:first-child{border-top:0}
.mute{color:var(--mute);font-size:13px}
.x{background:none;box-shadow:none;color:var(--mute);width:auto;margin:0;padding:4px 10px;font-size:22px}
.date{font-weight:700}
section{display:none}section.on{display:block;animation:f .25s}
@keyframes f{from{opacity:0;transform:translateY(6px)}}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:13px 13px 8px;position:relative;overflow:hidden}
.tile:active{transform:scale(.97)}
.tile .n{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.07em}
.tile .v{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:2px 0}
.tile .v small{font-size:13px;color:var(--mute);font-weight:500;margin-left:2px}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.08);color:var(--tx)}
.badge{position:absolute;top:10px;right:10px;font-size:11px;color:var(--mute)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;scrollbar-width:none}
.chip{flex:none;padding:8px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:13px;color:var(--mute)}
.chip.on{background:var(--grad);color:#fff;border-color:transparent;font-weight:600}
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ph{position:relative;aspect-ratio:3/4;border-radius:14px;overflow:hidden;background:#000}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph i{position:absolute;left:0;right:0;bottom:0;font-style:normal;font-size:10px;padding:14px 6px 4px;background:linear-gradient(transparent,rgba(0,0,0,.75))}
.ph.sel{outline:3px solid var(--a)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;z-index:30}
.ov.on{display:block}
.panel{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:#14161d;border-top:1px solid var(--line);border-radius:26px 26px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 24px);animation:u .28s}
@keyframes u{from{transform:translateY(40px);opacity:0}}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.ph-view{background:#000;z-index:40;text-align:center;padding:calc(env(safe-area-inset-top) + 12px) 12px}
.ph-view img{max-width:100%;max-height:70vh;border-radius:14px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:14px 0}.cmp img{width:100%;border-radius:12px}
nav{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 10px);display:flex;background:rgba(24,26,34,.82);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:24px;padding:6px;z-index:20}
nav a{flex:1;text-align:center;padding:8px 0 6px;color:var(--mute);font-size:11px;text-decoration:none;border-radius:18px}
nav a svg{width:23px;height:23px;display:block;margin:0 auto 2px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav a.on{color:#fff;background:var(--grad)}
.stat{font-size:34px;font-weight:800;letter-spacing:-.02em}
.up{color:#3ddc97}.dn{color:#ff6b6b}
svg.ch{width:100%;height:auto;display:block}
.empty{text-align:center;color:var(--mute);padding:30px 10px}
</style>
</head>
<body>

<section id="workouts" class="on">
  <h1>Workouts</h1><div class="sub">Log every set. Beat last week.</div>
  <div class="card">
    <label>Exercise</label><input id="wEx" list="exList" placeholder="e.g. Bench Press" autocomplete="off"><datalist id="exList"></datalist>
    <div class="g3" style="margin-top:10px">
      <div><label>Weight <span class="wu"></span></label><input id="wW" type="number" inputmode="decimal" step="any"></div>
      <div><label>Sets</label><input id="wS" type="number" inputmode="numeric" value="3"></div>
      <div><label>Reps</label><input id="wR" type="number" inputmode="numeric" value="8"></div>
    </div>
    <div style="margin-top:10px"><label>Date</label><input id="wD" type="date"></div>
    <button id="wAdd">Add set</button>
  </div>
  <div id="wList"></div>
</section>

<section id="body">
  <h1>Body</h1><div class="sub">Tap any body part to log it, see its trend and photos.</div>
  <div class="tiles" id="tiles"></div>
</section>

<section id="photos">
  <h1>Photos</h1><div class="sub">Your transformation, side by side.</div>
  <div class="grid"><button id="phAdd" style="margin:0">+ Add photo</button><button class="gh" id="phCmp" style="margin:0">Compare</button></div>
  <div class="chips" id="phChips" style="margin-top:14px"></div>
  <div id="phList"></div>
</section>

<section id="progress">
  <h1>Stats</h1><div class="sub">Charts and settings.</div>
  <div class="card"><label>Track</label><select id="pSel"></select><div id="pStat" style="margin-top:12px"></div><div id="pChart"></div></div>
  <h2>Settings</h2>
  <div class="card">
    <div class="grid"><div><label>Weight unit</label><select id="uW"><option>lb</option><option>kg</option></select></div>
    <div><label>Length unit</label><select id="uL"><option>in</option><option>cm</option></select></div></div>
    <button class="gh" id="exp">Export backup (with photos)</button>
    <button class="gh" id="imp">Import backup</button>
    <input id="impF" type="file" accept="application/json" hidden>
  </div>
  <p class="mute">Everything stays on this device. Export a backup now and then.</p>
</section>

<nav>
  <a href="#workouts" class="on"><svg viewBox="0 0 24 24"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>Lift</a>
  <a href="#body"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.5"/><path d="M7 21l2-9-3-3M17 21l-2-9 3-3M9 12h6"/></svg>Body</a>
  <a href="#photos"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Photos</a>
  <a href="#progress"><svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M8 15l4-4 3 3 5-6"/></svg>Stats</a>
</nav>

<div class="ov" id="sheet"><div class="panel" id="sBody"></div></div>
<div class="ov ph-view" id="viewer"></div>
<input id="file" type="file" accept="image/*" multiple hidden>

<script>
const $=id=>document.getElementById(id);
const KEY="gymTracker.v1";
let S={workouts:[],body:[],uW:"lb",uL:"in"},PH=[],db;
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
// migrate old one-row-per-day format
S.body=S.body.flatMap(m=>m.k?[m]:Object.keys(m).filter(x=>x!=="id"&&x!=="date"&&m[x]!=null).map(x=>({id:uid(),date:m.date,k:x==="arm"?"bicepL":x==="thigh"?"thighL":x,v:m[x]})));
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert("Couldn't save to this browser.")}};
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const fmtD=d=>new Date(d+"T12:00").toLocaleDateString(undefined,{month:"short",day:"numeric"});
const fmtY=d=>new Date(d+"T12:00").toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const P=(k,n,t)=>({k,n,t});
const PARTS=[P("weight","Weight","w"),P("fat","Body Fat","%"),P("neck","Neck","l"),P("shoulders","Shoulders","l"),P("chest","Chest","l"),P("waist","Waist","l"),P("hips","Hips","l"),
 P("bicepL","Left Bicep","l"),P("bicepR","Right Bicep","l"),P("forearmL","Left Forearm","l"),P("forearmR","Right Forearm","l"),
 P("thighL","Left Thigh","l"),P("thighR","Right Thigh","l"),P("calfL","Left Calf","l"),P("calfR","Right Calf","l")];
const POSES=[P("front","Front"),P("side","Side"),P("back","Back")];
const label=k=>(PARTS.concat(POSES).find(p=>p.k===k)||{n:k}).n;
const unit=t=>t==="w"?S.uW:t==="l"?S.uL:"%";
const series=k=>S.body.filter(b=>b.k===k).sort((a,b)=>a.date.localeCompare(b.date)||a.id.localeCompare(b.id));

// ---------- IndexedDB (photos) ----------
const dbReady=new Promise(res=>{try{const q=indexedDB.open("gymPhotos",1);q.onupgradeneeded=()=>q.result.createObjectStore("p",{keyPath:"id"});q.onsuccess=()=>{db=q.result;res()};q.onerror=()=>res()}catch(e){res()}});
const st=m=>db.transaction("p",m).objectStore("p");
const dbDo=(m,f)=>new Promise(r=>{if(!db)return r([]);try{const q=f(st(m));q.onsuccess=()=>r(q.result);q.onerror=()=>r([])}catch(e){r([])}});
const shrink=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const s=Math.min(1,1000/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*s;c.height=i.height*s;c.getContext("2d").drawImage(i,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.82))};i.onerror=rej;i.src=r.result};r.onerror=rej;r.readAsDataURL(f)});

// ---------- charts ----------
let gid=0;
function chart(pts,small){
  const W=small?100:320,H=small?34:190,p=small?3:30,v=pts.map(q=>q[1]);let mn=Math.min(...v),mx=Math.max(...v);if(mn===mx){mn-=1;mx+=1}
  const X=i=>pts.length===1?W/2:p+i*(W-2*p)/(pts.length-1),Y=y=>H-p-(y-mn)/(mx-mn)*(H-2*p),id="g"+gid++;
  const ln=pts.map((q,i)=>(i?"L":"M")+X(i).toFixed(1)+","+Y(q[1]).toFixed(1)).join("");
  const ar=ln+`L${X(pts.length-1)},${H-p}L${X(0)},${H-p}Z`;
  const g=`<defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff7a3d"/><stop offset="1" stop-color="#ff3d81"/></linearGradient><linearGradient id="${id}a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff3d81" stop-opacity=".3"/><stop offset="1" stop-color="#ff3d81" stop-opacity="0"/></linearGradient></defs>`;
  if(small)return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:34px;display:block">${g}${pts.length>1?`<path d="${ar}" fill="url(#${id}a)"/><path d="${ln}" fill="none" stroke="url(#${id})" stroke-width="2" vector-effect="non-scaling-stroke"/>`:`<circle cx="50" cy="17" r="3" fill="#ff3d81"/>`}</svg>`;
  return `<svg class="ch" viewBox="0 0 ${W} ${H}">${g}<path d="${ar}" fill="url(#${id}a)"/><path d="${ln}" fill="none" stroke="url(#${id})" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`+
   pts.map((q,i)=>`<circle cx="${X(i)}" cy="${Y(q[1])}" r="4" fill="#0b0c10" stroke="#ff3d81" stroke-width="2"/>`).join("")+
   `<text x="2" y="${Y(mx)+4}" fill="#8f96a8" font-size="10">${mx}</text><text x="2" y="${Y(mn)+4}" fill="#8f96a8" font-size="10">${mn}</text><text x="${p}" y="${H-6}" fill="#8f96a8" font-size="10">${fmtD(pts[0][0])}</text><text x="${W-p}" y="${H-6}" fill="#8f96a8" font-size="10" text-anchor="end">${fmtD(pts[pts.length-1][0])}</text></svg>`;
}

// ---------- tabs ----------
function route(){const h=(location.hash||"#workouts").slice(1);
  document.querySelectorAll("section").forEach(s=>s.classList.toggle("on",s.id===h));
  document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.hash==="#"+h));
  if(h==="progress")drawProgress();window.scrollTo(0,0)}
addEventListener("hashchange",route);
function units(){document.querySelectorAll(".wu").forEach(e=>e.textContent="("+S.uW+")");$("uW").value=S.uW;$("uL").value=S.uL}

// ---------- workouts ----------
function renderW(){
  $("exList").innerHTML=[...new Set(S.workouts.map(w=>w.ex))].sort().map(n=>`<option value="${esc(n)}">`).join("");
  const by={};S.workouts.forEach(w=>(by[w.date]=by[w.date]||[]).push(w));
  const days=Object.keys(by).sort().reverse();
  $("wList").innerHTML=days.length?days.map(d=>`<h2>${fmtY(d)}</h2><div class="card">`+by[d].map(w=>`<div class="row"><div><b>${esc(w.ex)}</b><div class="mute">${w.s} × ${w.r} @ ${w.w} ${S.uW}</div></div><button class="x" data-act="del" data-t="w" data-id="${w.id}">×</button></div>`).join("")+`</div>`).join(""):`<div class="empty">No workouts yet.<br>Log your first set above.</div>`;
}
$("wAdd").onclick=()=>{const ex=$("wEx").value.trim(),w=parseFloat($("wW").value);
  if(!ex||isNaN(w)){alert("Enter an exercise and weight.");return}
  S.workouts.push({id:uid(),date:$("wD").value||today(),ex,w,s:parseInt($("wS").value)||1,r:parseInt($("wR").value)||1});save();renderW();$("wW").value=""};

// ---------- body tiles ----------
function renderB(){
  $("tiles").innerHTML=PARTS.map(p=>{const a=series(p.k),l=a[a.length-1],pr=a[a.length-2],n=PH.filter(x=>x.part===p.k).length;
    let d="";if(l&&pr){const x=+(l.v-pr.v).toFixed(1);d=x?`<span class="pill">${x>0?"▲":"▼"} ${Math.abs(x)}</span>`:`<span class="pill">–</span>`}
    return `<div class="tile" data-act="part" data-k="${p.k}">${n?`<span class="badge">📷 ${n}</span>`:""}<div class="n">${p.n}</div><div class="v">${l?l.v:"—"}<small>${l?unit(p.t):""}</small></div><div style="height:20px">${d}</div>${a.length?chart(a.map(b=>[b.date,b.v]),1):`<div style="height:34px"></div>`}</div>`}).join("");
}
function openPart(k){const p=PARTS.find(x=>x.k===k),a=series(k),ph=PH.filter(x=>x.part===k).sort((a,b)=>b.date.localeCompare(a.date));
  $("sBody").innerHTML=`<div class="grab"></div><h1 style="font-size:24px">${p.n}</h1>
  <div class="grid" style="margin-top:12px"><div><label>Value (${unit(p.t)})</label><input id="sV" type="number" inputmode="decimal" step="any"></div><div><label>Date</label><input id="sD" type="date" value="${today()}"></div></div>
  <button data-act="saveM" data-k="${k}">Save measurement</button>
  <button class="gh" data-act="addph" data-k="${k}">📷 Add ${p.n.toLowerCase()} photo</button>
  ${a.length?`<h2>Trend</h2><div class="card">${chart(a.map(b=>[b.date,b.v]))}</div>`:""}
  ${ph.length?`<h2>Photos</h2><div class="pg">${ph.map(phTile).join("")}</div>`:""}
  ${a.length?`<h2>History</h2><div class="card">${a.slice().reverse().map(b=>`<div class="row"><span class="date">${fmtY(b.date)}</span><span>${b.v} ${unit(p.t)}<button class="x" data-act="del" data-t="b" data-id="${b.id}" data-k="${k}">×</button></span></div>`).join("")}</div>`:""}
  <button class="gh" data-act="close">Close</button>`;
  $("sheet").classList.add("on")}
const phTile=x=>`<div class="ph${cmpSel.includes(x.id)?" sel":""}" data-act="ph" data-id="${x.id}"><img src="${x.data}" loading="lazy"><i>${fmtD(x.date)} · ${label(x.part)}</i></div>`;

// ---------- photos ----------
let pf="all",cmpOn=false,cmpSel=[],pend=null;
function renderP(){
  const parts=[...new Set(PH.map(x=>x.part))];
  $("phChips").innerHTML=[["all","All"]].concat(parts.map(k=>[k,label(k)])).map(c=>`<div class="chip${pf===c[0]?" on":""}" data-act="chip" data-k="${c[0]}">${c[1]}</div>`).join("");
  const l=PH.filter(x=>pf==="all"||x.part===pf).sort((a,b)=>b.date.localeCompare(a.date));
  const by={};l.forEach(x=>(by[x.date]=by[x.date]||[]).push(x));
  $("phList").innerHTML=l.length?Object.keys(by).sort().reverse().map(d=>`<h2>${fmtY(d)}</h2><div class="pg">${by[d].map(phTile).join("")}</div>`).join(""):`<div class="empty">No photos yet.<br>Add front, side and back shots to start.</div>`;
  $("phCmp").textContent=cmpOn?"Pick 2 photos…":"Compare";$("phCmp").style.outline=cmpOn?"2px solid var(--a)":"";
}
function pickPhoto(part,date){pend={part,date:date||today()};$("file").value="";$("file").click()}
$("file").onchange=async e=>{if(!pend)return;const fs=[...e.target.files];if(!db){alert("This browser can't store photos.");return}
  for(const f of fs){try{const o={id:uid(),date:pend.date,part:pend.part,data:await shrink(f)};await dbDo("readwrite",s=>s.put(o));PH.push(o)}catch(x){alert("Couldn't read that image.")}}
  renderP();renderB();if($("sheet").classList.contains("on"))openPart(pend.part);pend=null};
$("phAdd").onclick=()=>{$("sBody").innerHTML=`<div class="grab"></div><h1 style="font-size:24px">Add photo</h1>
  <div style="margin-top:12px"><label>What is it?</label><select id="aP">${POSES.concat(PARTS.filter(p=>p.t==="l")).map(p=>`<option value="${p.k}">${p.n}</option>`).join("")}</select></div>
  <div style="margin-top:10px"><label>Date</label><input id="aD" type="date" value="${today()}"></div>
  <button data-act="aGo">Choose / take photo</button><button class="gh" data-act="close">Cancel</button>`;$("sheet").classList.add("on")};
$("phCmp").onclick=()=>{cmpOn=!cmpOn;cmpSel=[];renderP()};
function viewPhoto(id){const x=PH.find(p=>p.id===id);if(!x)return;
  $("viewer").innerHTML=`<img src="${x.data}"><h1 style="font-size:20px;margin-top:12px">${label(x.part)}</h1><div class="mute">${fmtY(x.date)}</div>
  <button data-act="delph" data-id="${id}" class="gh" style="color:#ff6b6b">Delete photo</button><button data-act="vclose">Close</button>`;$("viewer").classList.add("on")}
function compare(){const [a,b]=cmpSel.map(id=>PH.find(p=>p.id===id)).sort((p,q)=>p.date.localeCompare(q.date));
  $("viewer").innerHTML=`<h1 style="font-size:20px">Before / After</h1><div class="cmp"><div><img src="${a.data}"><div class="mute">${fmtY(a.date)} · ${label(a.part)}</div></div><div><img src="${b.data}"><div class="mute">${fmtY(b.date)} · ${label(b.part)}</div></div></div><button data-act="vclose">Close</button>`;
  $("viewer").classList.add("on");cmpOn=false;cmpSel=[];renderP()}

// ---------- stats ----------
function fillSel(){const c=$("pSel").value,ex=[...new Set(S.workouts.map(w=>w.ex))].sort();
  $("pSel").innerHTML=(ex.length?`<optgroup label="Lifts (top weight)">${ex.map(n=>`<option value="e:${esc(n)}">${esc(n)}</option>`).join("")}</optgroup>`:"")+`<optgroup label="Body">${PARTS.map(p=>`<option value="b:${p.k}">${p.n}</option>`).join("")}</optgroup>`;
  if(c)$("pSel").value=c}
function drawProgress(){fillSel();const v=$("pSel").value||"",t=v[0],k=v.slice(2);let pts=[],u="";
  if(t==="e"){const m={};S.workouts.filter(w=>w.ex===k).forEach(w=>m[w.date]=Math.max(m[w.date]||0,w.w));pts=Object.entries(m).sort();u=S.uW}
  else if(t==="b"){pts=series(k).map(b=>[b.date,b.v]);u=unit(PARTS.find(p=>p.k===k).t)}
  if(!pts.length){$("pStat").innerHTML=`<span class="mute">No data yet.</span>`;$("pChart").innerHTML="";return}
  const vals=pts.map(p=>p[1]),last=vals[vals.length-1],d=+(last-vals[0]).toFixed(1);
  $("pStat").innerHTML=`<div class="stat">${last} <small class="mute" style="font-size:16px">${u}</small></div><div class="mute">${t==="e"?"Best "+Math.max(...vals)+" "+u+" · ":""}${pts.length} entries · ${d>0?"+":""}${d} since start</div>`;
  $("pChart").innerHTML=chart(pts)}
$("pSel").onchange=drawProgress;

// ---------- settings / backup ----------
$("uW").onchange=e=>{S.uW=e.target.value;save();units();renderW();renderB();drawProgress()};
$("uL").onchange=e=>{S.uL=e.target.value;save();renderB();drawProgress()};
$("exp").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify({...S,photos:PH})],{type:"application/json"}));a.download="gym-backup-"+today()+".json";a.click()};
$("imp").onclick=()=>$("impF").click();
$("impF").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=async()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.workouts)||!Array.isArray(d.body))throw 0;
    if(!confirm("Replace current data with this backup?"))return;
    const ph=d.photos||[];delete d.photos;S=Object.assign(S,d);save();
    await dbDo("readwrite",s=>s.clear());for(const o of ph)await dbDo("readwrite",s=>s.put(o));PH=ph;
    units();renderW();renderB();renderP();drawProgress()}catch(x){alert("That file isn't a valid backup.")}};r.readAsText(f)};

// ---------- clicks ----------
document.addEventListener("click",async e=>{
  if(e.target.id==="sheet"){$("sheet").classList.remove("on");return}
  const el=e.target.closest("[data-act]");if(!el)return;const a=el.dataset.act,d=el.dataset;
  if(a==="part")openPart(d.k);
  else if(a==="close")$("sheet").classList.remove("on");
  else if(a==="vclose")$("viewer").classList.remove("on");
  else if(a==="saveM"){const v=parseFloat($("sV").value);if(isNaN(v)){alert("Enter a value.");return}
    S.body.push({id:uid(),date:$("sD").value||today(),k:d.k,v});save();renderB();drawProgress();openPart(d.k)}
  else if(a==="addph")pickPhoto(d.k,$("sD").value);
  else if(a==="aGo"){const p=$("aP").value,dt=$("aD").value;$("sheet").classList.remove("on");pickPhoto(p,dt)}
  else if(a==="chip"){pf=d.k;renderP()}
  else if(a==="ph"){if(cmpOn){const i=cmpSel.indexOf(d.id);i>-1?cmpSel.splice(i,1):cmpSel.push(d.id);if(cmpSel.length===2)compare();else renderP()}else viewPhoto(d.id)}
  else if(a==="delph"){if(!confirm("Delete this photo?"))return;await dbDo("readwrite",s=>s.delete(d.id));PH=PH.filter(x=>x.id!==d.id);$("viewer").classList.remove("on");renderP();renderB();if($("sheet").classList.contains("on"))$("sheet").classList.remove("on")}
  else if(a==="del"){if(!confirm("Delete this entry?"))return;
    if(d.t==="w")S.workouts=S.workouts.filter(x=>x.id!==d.id);else S.body=S.body.filter(x=>x.id!==d.id);
    save();renderW();renderB();drawProgress();if(d.t==="b")openPart(d.k)}
});

// ---------- init ----------
$("wD").value=today();units();renderW();renderB();renderP();route();
dbReady.then(dbAll=>dbDo("readonly",s=>s.getAll())).then(r=>{PH=r||[];renderP();renderB()});
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
